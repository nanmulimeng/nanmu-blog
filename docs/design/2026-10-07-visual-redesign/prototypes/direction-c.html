<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 C「活字」· 首页 — nanmu-blog 视觉原型</title>
<!-- 视觉原型 · 方向 C「活字 · 一色印刷」:主视觉=活字盘,字粒=真实文章标题;空钉位如实可见 -->
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#FCFBF5; --ink:#17150F; --ink2:#7C7869; --line:#DDD8C8;
  --lead:#B9B4A4;                       /* 铅字金属色 */
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","SimSun",serif;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#141310; --ink:#E6E2D3; --ink2:#8A8574; --line:#33302A; --lead:#4A463C;
}}
:root[data-theme="dark"]{
  --paper:#141310; --ink:#E6E2D3; --ink2:#8A8574; --line:#33302A; --lead:#4A463C;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--serif); transition:background-color .25s ease,color .25s ease}
a{color:inherit; text-decoration:none}
.wrap{max-width:1080px; margin:0 auto; padding:0 clamp(20px,4vw,48px)}

header{display:flex; justify-content:space-between; align-items:baseline;
  padding:24px 0; border-bottom:2.5px solid var(--ink)}
header .logo{font-weight:900; font-size:22px; letter-spacing:.06em}
nav{display:flex; gap:clamp(16px,3vw,32px); align-items:baseline}
nav a{font-size:14.5px; color:var(--ink2); padding-bottom:3px; border-bottom:1.5px solid transparent}
nav a:hover{color:var(--ink); border-color:var(--ink)}
nav a[aria-current]{color:var(--ink); border-color:var(--ink)}
#theme-btn{font-family:var(--serif); font-size:13px; background:none; color:var(--ink2);
  border:1px solid var(--line); padding:4px 10px; cursor:pointer}
#theme-btn:hover{border-color:var(--ink); color:var(--ink)}

/* 主视觉区:竖排题记 + 活字盘 */
.hero{display:grid; grid-template-columns:auto minmax(0,1fr); gap:clamp(24px,5vw,72px);
  padding:clamp(30px,6vw,64px) 0; align-items:start}
.motto-v{writing-mode:vertical-rl; font-size:clamp(20px,2.6vw,28px); font-weight:900;
  letter-spacing:.3em; line-height:1.6; margin:0; height:15em}
.motto-v small{writing-mode:vertical-rl; font-size:12px; font-weight:400; color:var(--ink2);
  letter-spacing:.2em; margin-right:14px}
.tray-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:12px}
.tray-head h2{margin:0; font-size:15px; font-weight:600; letter-spacing:.3em}
.tray-head span{font-size:12px; color:var(--ink2); letter-spacing:.1em}
.tray{display:grid; grid-template-columns:repeat(6,1fr); border:2px solid var(--ink); background:var(--ink); gap:2px}
.cell{aspect-ratio:1; background:var(--paper); display:grid; place-items:center;
  font-size:clamp(20px,3.4vw,34px); font-weight:600; position:relative; perspective:400px}
.cell.empty{color:var(--line)}
.cell.empty::after{content:""; width:22%; height:22%; border:1px dashed var(--lead)}
a.cell .face{transition:transform .3s ease,opacity .18s ease; display:grid; place-items:center;
  position:absolute; inset:6%}
a.cell .back{opacity:0; transform:rotateY(90deg); background:var(--lead); color:var(--paper)}
a.cell .back span{transform:scaleX(-1)}              /* 铅字凸面:反字 */
a.cell:hover .front{transform:rotateY(90deg); opacity:0}
a.cell:hover .back{transform:none; opacity:1}
/* 载入:字粒逐粒落盘,一次(动画在格子上,不触碰翻面变换) */
a.cell{animation:set .35s cubic-bezier(.3,1.4,.5,1) both}
a.cell:nth-of-type(1){animation-delay:.05s} a.cell:nth-of-type(2){animation-delay:.1s}
a.cell:nth-of-type(3){animation-delay:.15s} a.cell:nth-of-type(4){animation-delay:.2s}
a.cell:nth-of-type(5){animation-delay:.25s} a.cell:nth-of-type(6){animation-delay:.3s}
a.cell:nth-of-type(7){animation-delay:.35s} a.cell:nth-of-type(8){animation-delay:.4s}
a.cell:nth-of-type(9){animation-delay:.45s} a.cell:nth-of-type(10){animation-delay:.5s}
a.cell:nth-of-type(11){animation-delay:.55s} a.cell:nth-of-type(12){animation-delay:.6s}
a.cell:nth-of-type(13){animation-delay:.65s}
@keyframes set{from{transform:translateY(-30%); opacity:0} to{transform:none; opacity:1}}
.tray-cap{margin-top:10px; font-size:13px; color:var(--ink2); line-height:1.9}
.tray-cap b{color:var(--ink); font-weight:600}

/* 目录:书页式列表 */
.contents{border-top:2.5px solid var(--ink); padding:clamp(24px,4vw,40px) 0}
.contents h2{font-size:15px; font-weight:600; letter-spacing:.3em; margin:0 0 18px}
.toc-row{display:flex; align-items:baseline; gap:14px; padding:14px 2px; font-size:17px}
.toc-row .no{color:var(--ink2); font-size:13px; flex:none}
.toc-row .t{font-weight:600}
.toc-row:hover .t{text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1.5px}
.toc-row .dots{flex:1; border-bottom:1px dotted var(--ink2); transform:translateY(-4px)}
.toc-row .pg{font-size:13px; color:var(--ink2)}
.toc-row .sub{width:100%; font-size:13.5px; color:var(--ink2); font-weight:400; margin-top:2px}
.toc-empty{padding:18px 2px; color:var(--ink2); font-size:14.5px}
.toc-empty .stamp-ai{display:inline-block; border:1.5px solid var(--ink2); font-size:12px;
  padding:0 6px; margin-right:8px; transform:rotate(-4deg)}
.sect-label{writing-mode:vertical-rl; letter-spacing:.4em; color:var(--ink2); font-size:12px}

footer{border-top:1px solid var(--line); padding:22px 0 38px; display:flex;
  justify-content:space-between; flex-wrap:wrap; gap:10px; font-size:12.5px; color:var(--ink2)}
footer a{border-bottom:1px solid var(--line)}
footer a:hover{color:var(--ink); border-color:var(--ink)}

@media (max-width:700px){
  .hero{grid-template-columns:1fr}
  .motto-v{writing-mode:horizontal-tb; height:auto; letter-spacing:.12em}
  .motto-v small{writing-mode:horizontal-tb; display:block; margin:8px 0 0}
  .tray{grid-template-columns:repeat(6,1fr)}
}
@media (prefers-reduced-motion:reduce){
  a.cell{animation:none !important}
  a.cell *{transition:none !important}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="#">南木博客<sup style="font-size:10px;color:var(--ink2)">nanmu</sup></a>
    <nav>
      <a href="#" aria-current="page">目录</a>
      <a href="#">日报</a>
      <a href="#">关于</a>
      <button id="theme-btn" type="button">夜印</button>
    </nav>
  </header>

  <section class="hero">
    <p class="motto-v"><small>建站纪 · 其一</small>先把最小的东西做完</p>
    <div>
      <div class="tray-head"><h2>活 字 盘</h2><span>现存字粒 = 已发布标题用字</span></div>
      <!-- 字粒来自真实文章标题「你好,nanmu-blog」;空位即空位 -->
      <div class="tray" role="list" aria-label="活字盘">
        <a class="cell" href="#" role="listitem"><span class="face front">你</span><span class="face back"><span>你</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">好</span><span class="face back"><span>好</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">,</span><span class="face back"><span>,</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">n</span><span class="face back"><span>n</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">a</span><span class="face back"><span>a</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">n</span><span class="face back"><span>n</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">m</span><span class="face back"><span>m</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">u</span><span class="face back"><span>u</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">-</span><span class="face back"><span>-</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">b</span><span class="face back"><span>b</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">l</span><span class="face back"><span>l</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">o</span><span class="face back"><span>o</span></span></a>
        <a class="cell" href="#" role="listitem"><span class="face front">g</span><span class="face back"><span>g</span></span></a>
        <span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span>
        <span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span>
        <span class="cell empty"></span><span class="cell empty"></span><span class="cell empty"></span>
        <span class="cell empty"></span><span class="cell empty"></span>
      </div>
      <p class="tray-cap">盘里目前只有一篇文章的字,<b>十三个</b>;其余钉位空着。字会随文章多起来——悬停任一字粒,看它翻成铅字的反面;点按进入那篇文章。</p>
    </div>
  </section>

  <section class="contents">
    <h2>目 录</h2>
    <a class="toc-row" href="#">
      <span class="no">001</span>
      <span style="flex:1;display:flex;flex-direction:column">
        <span style="display:flex;align-items:baseline;gap:14px">
          <span class="t">你好,nanmu-blog</span><span class="dots"></span><span class="pg">2026 · 10 · 02</span>
        </span>
        <span class="sub">前身烂尾的教训,与这次最小闭环的来历。</span>
      </span>
    </a>
    <div class="toc-empty">
      <span class="stamp-ai">机印</span>日报一辑:尚未开印。开印后逐期登记于此,注明机型与纸墨(模型与费用)。
    </div>
  </section>

  <footer>
    <span>© 2026 南木 nanmu · 一色印刷</span>
    <span><a href="#">文章 RSS</a> · <a href="#">日报 RSS</a></span>
  </footer>
</div>
<script>
/* 【原型演示专用】正式站当前零客户端 JS。 */
(function(){
  var b=document.getElementById('theme-btn'),root=document.documentElement;
  function cur(){return root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);}
  function sync(){b.textContent=cur()?'日印':'夜印';}
  b.addEventListener('click',function(){root.dataset.theme=cur()?'light':'dark';sync();});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sync);
  sync();
})();
</script>
</body>
</html>
