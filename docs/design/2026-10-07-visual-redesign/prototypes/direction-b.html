<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>方向 B「蓝晒」· 首页 — nanmu-blog 视觉原型</title>
<!-- 视觉原型 · 方向 B「蓝晒 · 工程底图」:整站是一张图纸;深色=蓝晒底片 -->
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#FBFBF7; --ink:#1B3A6B; --ink2:#5C7195; --hair:#C9D4E6;
  --fill:#EEF2F9; --accent:#1B3A6B;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0F2A55; --ink:#A9C8F0; --ink2:#6E8CBD; --hair:#2A4A86;
  --fill:#16345F; --accent:#A9C8F0;
}}
:root[data-theme="dark"]{
  --paper:#0F2A55; --ink:#A9C8F0; --ink2:#6E8CBD; --hair:#2A4A86;
  --fill:#16345F; --accent:#A9C8F0;
}
*{box-sizing:border-box}
body{margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.9;
  transition:background-color .25s ease,color .25s ease}
a{color:inherit; text-decoration:none}
.mono{font-family:var(--mono); font-size:.8rem; letter-spacing:.02em}

/* 整张页面是一张带图框的图纸 */
.sheet{min-height:100vh; padding:clamp(10px,1.6vw,20px)}
.frame-box{border:1.5px solid var(--ink); min-height:calc(100vh - 2*clamp(10px,1.6vw,20px));
  padding:clamp(18px,3vw,40px); position:relative}
.frame-box::before{content:""; position:absolute; inset:6px; border:0.5px solid var(--hair); pointer-events:none}
/* 折图标记 */
.fold{position:absolute; width:14px; height:14px; border:1px solid var(--hair); border-radius:50%}
.fold.tl{top:-7px; left:25%} .fold.tr{top:-7px; right:25%}

header{display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:1.5px solid var(--ink); padding-bottom:14px; margin-bottom:0}
header .docno{font-family:var(--mono); font-size:.8rem; color:var(--ink2)}
header h1{font-size:20px; margin:0; font-weight:700; letter-spacing:.12em}
nav{display:flex; gap:clamp(14px,2.5vw,30px); align-items:baseline}
nav a{font-family:var(--mono); font-size:.82rem; color:var(--ink2); padding:3px 0; position:relative}
nav a:hover{color:var(--ink)}
nav a[aria-current]{color:var(--ink); box-shadow:inset 0 -2px 0 var(--ink)}
#theme-btn{font-family:var(--mono); font-size:.78rem; background:none; color:var(--ink2);
  border:1px solid var(--hair); padding:4px 10px; cursor:pointer}
#theme-btn:hover{border-color:var(--ink); color:var(--ink)}

.plan-grid{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:clamp(20px,3vw,44px);
  padding-top:clamp(20px,3vw,36px)}

/* 平面图 */
.plan{width:100%; height:auto; display:block}
.plan text{font-family:var(--mono); fill:var(--ink)}
.plan .site{fill:none; stroke:var(--ink2); stroke-width:1; stroke-dasharray:8 5}
.plan .wall{fill:var(--fill); stroke:var(--ink); stroke-width:2}
.plan .wall-inner{fill:none; stroke:var(--ink); stroke-width:.8}
.plan .wing{fill:none; stroke:var(--ink); stroke-width:1.2; stroke-dasharray:6 4}
.plan .plotb{fill:none; stroke:var(--ink2); stroke-width:1; stroke-dasharray:2 4}
.plan .dim{stroke:var(--ink2); stroke-width:.7}
.plan .dim-t{stroke:var(--ink2); stroke-width:.7}
.plan .dim-text{font-size:10.5px; fill:var(--ink2)}
.plan .room-t{font-size:14px; font-weight:500; font-family:var(--sans)}
.plan .room-s{font-size:10px; fill:var(--ink2)}
.plan .hatch{fill:url(#hatch); opacity:.25; transition:opacity .25s ease}
.plan .room{cursor:pointer}
.plan .room:hover .hatch{opacity:.85}
.plan .room:hover .wall{stroke-width:2.8}
.plan .treec{fill:none; stroke:var(--ink2); stroke-width:1; stroke-dasharray:2 3}
.plan .narr{fill:var(--ink)}
.plan .tb{fill:var(--paper); stroke:var(--ink); stroke-width:1.2}
.plan .tbl{stroke:var(--ink); stroke-width:.6}
.plan .tb-name{font-size:12px; font-family:var(--sans); font-weight:700}
.plan .tb-s{font-size:9px; fill:var(--ink2)}
.plan .rev{fill:none; stroke:var(--ink); stroke-width:1.4}
.plan .rev-t{font-size:10px; fill:var(--ink); letter-spacing:2px}
/* 载入:尺寸线后绘出 */
.plan .dim{stroke-dasharray:1; stroke-dashoffset:1; animation:draw .8s ease .5s both}
.plan .dim-text{opacity:0; animation:fadein .4s ease 1s both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .plan *{animation:none !important; stroke-dashoffset:0 !important; opacity:1 !important}
  .plan .hatch{opacity:.25}
  *{transition:none !important}
}

/* 图纸目录 */
.register h2{font-family:var(--mono); font-size:.85rem; font-weight:500; letter-spacing:.25em;
  color:var(--ink2); margin:0 0 10px}
table{width:100%; border-collapse:collapse; font-size:14px}
th{font-family:var(--mono); font-size:.72rem; font-weight:500; color:var(--ink2);
  text-align:left; padding:8px 10px; border-bottom:1.5px solid var(--ink)}
td{padding:11px 10px; border-bottom:1px solid var(--hair); vertical-align:baseline}
tr.row{cursor:pointer; transition:background .15s ease}
tr.row:hover{background:var(--fill)}
td.no,th.no{font-family:var(--mono); font-size:.8rem; white-space:nowrap}
td.date{font-family:var(--mono); font-size:.78rem; color:var(--ink2); white-space:nowrap}
td.rev{font-family:var(--mono); font-size:.78rem}
.empty td{color:var(--ink2); font-family:var(--mono); font-size:.8rem; letter-spacing:.05em}
.tag-ai{display:inline-block; font-family:var(--mono); font-size:.68rem; border:1px solid var(--ink2);
  color:var(--ink2); padding:1px 6px; margin-left:8px; vertical-align:2px}
.note{margin-top:26px; border-left:2px solid var(--ink); padding:2px 0 2px 14px;
  font-size:13.5px; color:var(--ink2); line-height:2}
.note b{color:var(--ink); font-weight:500}

footer{margin-top:clamp(28px,4vw,48px); border-top:1.5px solid var(--ink); padding-top:14px;
  display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px;
  font-family:var(--mono); font-size:.75rem; color:var(--ink2)}
footer a{border-bottom:1px solid var(--hair)}
footer a:hover{color:var(--ink); border-color:var(--ink)}

@media (max-width:860px){
  .plan-grid{grid-template-columns:1fr}
  .plan .dim-text{font-size:12px}
}
@media (max-width:640px){
  header{flex-wrap:wrap; row-gap:8px}
  nav{width:100%; justify-content:space-between; gap:8px}
}
</style>
</head>
<body>
<div class="sheet">
<div class="frame-box">
  <span class="fold tl"></span><span class="fold tr"></span>
  <header>
    <span class="docno">图号 NM-SITE-001</span>
    <h1>NANMU-BLOG</h1>
    <nav>
      <a href="#" aria-current="page">总平面</a>
      <a href="#">目录</a>
      <a href="#">日报</a>
      <a href="#">说明</a>
      <button id="theme-btn" type="button">蓝晒</button>
    </nav>
  </header>

  <div class="plan-grid">
    <!-- 主视觉:俯视总平面图;尺寸标注即真实数据 -->
    <svg class="plan" viewBox="0 0 600 400" role="img" aria-label="总平面图:实线房间为文章,虚线为日报,点线为检索">
      <defs>
        <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <line x1="0" y1="0" x2="0" y2="7" stroke="var(--ink)" stroke-width=".7"/>
        </pattern>
      </defs>
      <rect x="36" y="36" width="528" height="330" class="site"/>
      <!-- 正房(文章) -->
      <g class="room">
        <rect x="80" y="90" width="220" height="150" class="hatch"/>
        <rect x="80" y="90" width="220" height="150" class="wall"/>
        <rect x="88" y="98" width="204" height="134" class="wall-inner"/>
        <text x="190" y="158" class="room-t" text-anchor="middle">文章</text>
        <text x="190" y="178" class="room-s" text-anchor="middle">POSTS · 手写</text>
      </g>
      <!-- 东厢(日报,虚线) -->
      <g class="room">
        <rect x="350" y="90" width="170" height="110" class="wing"/>
        <text x="435" y="140" class="room-t" text-anchor="middle">日报</text>
        <text x="435" y="158" class="room-s" text-anchor="middle">DIGEST · AI 生成</text>
      </g>
      <!-- 留白(检索,点线) -->
      <g class="room">
        <rect x="350" y="240" width="170" height="90" class="plotb"/>
        <text x="435" y="282" class="room-t" text-anchor="middle" fill="var(--ink2)">检索</text>
        <text x="435" y="300" class="room-s" text-anchor="middle">RAG · 未动工</text>
      </g>
      <circle cx="140" cy="305" r="16" class="treec"/>
      <circle cx="140" cy="305" r="5" class="treec"/>
      <!-- 尺寸标注:数字即真实状态 -->
      <g>
        <line x1="80" y1="272" x2="300" y2="272" class="dim" pathLength="1"/>
        <line x1="80" y1="266" x2="80" y2="278" class="dim-t"/>
        <line x1="300" y1="266" x2="300" y2="278" class="dim-t"/>
        <text x="190" y="264" class="dim-text" text-anchor="middle">现存 1 篇</text>
      </g>
      <g>
        <line x1="546" y1="90" x2="546" y2="200" class="dim" pathLength="1"/>
        <line x1="540" y1="90" x2="552" y2="90" class="dim-t"/>
        <line x1="540" y1="200" x2="552" y2="200" class="dim-t"/>
        <text x="556" y="148" class="dim-text" transform="rotate(90 556 145)">0 期</text>
      </g>
      <!-- 指北针与图签 -->
      <g transform="translate(70,60)"><path d="M0 10 L4 -3 L0 -12 L-4 -3 Z" class="narr"/><text y="-16" font-size="10" text-anchor="middle" fill="var(--ink2)">N</text></g>
      <g transform="translate(392,338)">
        <rect width="172" height="46" class="tb"/>
        <line x1="0" y1="23" x2="172" y2="23" class="tbl"/>
        <text x="8" y="16" class="tb-name">nanmu.xyz 总平面</text>
        <text x="8" y="37" class="tb-s">2026-10 · SCALE 1:1 · SHEET 1/1</text>
      </g>
      <g transform="translate(296,326) rotate(-6 32 13)">
        <rect width="64" height="26" class="rev"/>
        <text x="32" y="17" class="rev-t" text-anchor="middle">R2 上线</text>
      </g>
    </svg>

    <!-- 图纸目录 = 文章列表 -->
    <div class="register">
      <h2>图纸目录 / DRAWING REGISTER</h2>
      <table>
        <thead><tr><th class="no">编号</th><th>名称</th><th>日期</th><th>版次</th></tr></thead>
        <tbody>
          <tr class="row">
            <td class="no">A-001</td>
            <td>你好,nanmu-blog</td>
            <td class="date">2026-10-02</td>
            <td class="rev">R0</td>
          </tr>
          <tr class="empty"><td class="no">B-…</td><td>日报系列<span class="tag-ai">AI</span></td><td class="date" colspan="2">暂无存档,机器调试中</td></tr>
        </tbody>
      </table>
      <div class="note">
        <b>制图说明。</b>本图按现状绘制:实线为已建成并投入使用,虚线为施工中,点线为规划。数量标注取自真实内容,不画没有的东西。
      </div>
      <div class="note">
        页面只读预生成内容;日报由独立引擎生成,每期注明模型与费用。
      </div>
    </div>
  </div>

  <footer>
    <span>© 2026 NANMU</span>
    <span><a href="#">RSS:文章</a> · <a href="#">RSS:日报</a></span>
    <span>WHITE / BLUEPRINT 双版式</span>
  </footer>
</div>
</div>
<script>
/* 【原型演示专用】正式站当前零客户端 JS。 */
(function(){
  var b=document.getElementById('theme-btn'),root=document.documentElement;
  function cur(){return root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);}
  function sync(){b.textContent=cur()?'白纸':'蓝晒';}
  b.addEventListener('click',function(){root.dataset.theme=cur()?'light':'dark';sync();});
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',sync);
  sync();
})();
</script>
</body>
</html>
