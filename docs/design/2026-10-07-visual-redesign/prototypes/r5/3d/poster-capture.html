<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>碑页静态备用图拍摄</title>
<style>html,body,#scene{margin:0;width:100%;height:100%;overflow:hidden}</style>
<div id="scene" aria-label="碑页场景,备用图拍摄视图"></div>
<script type="module">
import {createScene} from './scene5.js';
// Local asset-production entry, not a public page.
// 等文字纹理排印完成 + 入场动画结束后再由外部截图。
const scene = await createScene(document.getElementById('scene'));
await scene.texReady;
scene.setTheme(new URLSearchParams(location.search).get('theme') === 'dark', true);
scene.setAmbient(false);
window.__captureReady = true;
</script>
</html>
