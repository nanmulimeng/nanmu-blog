<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>工作台 · nanmu 写作台</title>
<link rel="stylesheet" href="/static/workbench.css">
</head>
<body class="wb-page">
<main class="wb-card wb-list">
  <header class="wb-list-head">
    <h1>草稿</h1>
    <span>
      <a href="/edit/new">+ 新建草稿</a> ·
      <button type="button" id="logout-btn" class="wb-ghost wb-inline-btn">登出</button>
    </span>
  </header>

  <table class="wb-table" id="drafts-table">
    <thead>
      <tr><th>slug</th><th>标题</th><th>日期</th><th>字数</th><th>rev</th><th>操作</th></tr>
    </thead>
    <tbody id="drafts-body">
      <tr><td colspan="6" class="wb-status">加载中…</td></tr>
    </tbody>
  </table>

  <h2>已发布</h2>
  <p class="wb-note">
    已发布列表需要读取 Git 仓库(批 3 接入),当前不可用——本批为本地批,未接 Git。
  </p>

  <h2>尚未提供的能力(如实标注,不做假按钮)</h2>
  <p class="wb-note">
    预览(批 2)、发布 / 撤下(批 3)、域名上线(批 4)。列表中的「预览 / 发布」入口届时启用。
  </p>

  <p id="home-status" class="wb-status" role="status" aria-live="polite"></p>
</main>
<script src="/static/home.js"></script>
</body>
</html>
